<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Quorum</title>
  <style>
    /* Terminal green tokens (Plan 12), light and dark. Inline, with no other files: offline.html is served in place
       of the hub, where Capacitor serves only that one bundled file. The platform sans-serif stack stands in for
       Geist, so nothing needs the network. Keep this block the same in index.html and offline.html. */
    :root {
      color-scheme: light dark;
      --background: #F7F8F7;
      --surface: #FFFFFF;
      --ink: #111814;
      --muted: #5D6861;
      --line: #E0E6E2;
      --accent: #0C7548;
      --on-accent: #FFFFFF;
      --danger: #B3261E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0E1311;
        --surface: #161C19;
        --ink: #E3ECE7;
        --muted: #8FA198;
        --line: #24302A;
        --accent: #3DDC97;
        --on-accent: #06140D;
        --danger: #F2B8B5;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--background);
      color: var(--ink);
      font: 16px/1.5 "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px 20px;
    }
    .mark { display: block; color: var(--accent); margin-bottom: 12px; }
    h1 { font-size: 22px; line-height: 1.3; font-weight: 600; margin: 0 0 4px; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: 15px; }
    form { margin-top: 20px; display: grid; gap: 8px; }
    label { font-size: 15px; font-weight: 500; }
    input {
      font: inherit;
      font-size: 16px;
      min-height: 48px;
      width: 100%;
      padding: 10px 12px;
      color: var(--ink);
      background: var(--background);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    .actions { display: grid; gap: 8px; margin-top: 20px; }
    form .actions { margin-top: 12px; }
    button {
      font: inherit;
      font-weight: 500;
      min-height: 48px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: var(--on-accent); }
    button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
    button:disabled { opacity: 0.6; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .status { min-height: 24px; font-size: 15px; color: var(--muted); }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" width="40" height="40" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true"><circle cx="24" cy="9" r="4.3"/><circle cx="34.6" cy="13.4" r="4.3"/><circle cx="39" cy="24" r="4.3"/><circle cx="24" cy="39" r="4.3"/><circle cx="13.4" cy="34.6" r="4.3"/><circle cx="9" cy="24" r="4.3"/><circle cx="13.4" cy="13.4" r="4.3"/><rect x="29" y="31" width="15" height="5.4" rx="2.7" transform="rotate(45 36.5 33.7)"/></svg>
    <h1>Can't reach the hub. Is Tailscale connected?</h1>
    <p class="muted">Your hub address is saved. Connect to Tailscale, then retry.</p>
    <div class="actions">
      <button id="retry" class="primary" type="button">Retry</button>
      <button id="change" class="secondary" type="button">Change hub</button>
    </div>
  </main>
  <script>
    // This page is shown in place of the hub, where the Capacitor bridge is not injected, so it talks to the
    // shell through quorum-shell:// navigations that MainActivity intercepts.
    document.getElementById('retry').addEventListener('click', () => { location.href = 'quorum-shell://retry' })
    document.getElementById('change').addEventListener('click', () => { location.href = 'quorum-shell://change-hub' })
  </script>
</body>
</html>
